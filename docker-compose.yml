services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sitcat}
      POSTGRES_USER: ${POSTGRES_USER:-sitcat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sitcat_dev_only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sitcat} -d ${POSTGRES_DB:-sitcat}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: ${MINIO_IMAGE:-public.ecr.aws/y9w4h2u9/minio:RELEASE.2025-09-07T16-13-09Z}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-sitcat}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-sitcat_minio_dev_only}
    volumes:
      - minio_data:/data
    ports:
      - "9001:9001"

  api:
    build:
      context: ./backend
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-local-only}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,api}
      POSTGRES_DB: ${POSTGRES_DB:-sitcat}
      POSTGRES_USER: ${POSTGRES_USER:-sitcat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sitcat_dev_only}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: http://minio:9000
      MINIO_BUCKET: ${MINIO_BUCKET:-sitcat-archivos}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: ./backend
    command: ["celery", "-A", "config", "worker", "--loglevel=INFO"]
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-local-only}
      POSTGRES_DB: ${POSTGRES_DB:-sitcat}
      POSTGRES_USER: ${POSTGRES_USER:-sitcat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sitcat_dev_only}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  martin:
    image: ghcr.io/maplibre/martin:v0.15.0
    command:
      - postgres://${POSTGRES_USER:-sitcat}:${POSTGRES_PASSWORD:-sitcat_dev_only}@db:5432/${POSTGRES_DB:-sitcat}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/catalog"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build:
      context: ./frontend
    depends_on:
      api:
        condition: service_healthy

  proxy:
    image: nginx:1.27-alpine
    ports:
      - "8081:80"
    volumes:
      - ./infra/proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - api
      - martin

volumes:
  postgres_data:
  redis_data:
  minio_data:



