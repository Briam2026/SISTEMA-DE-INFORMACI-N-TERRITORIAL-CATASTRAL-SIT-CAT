<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#153c30">
  <title>SIT-CAT · Gestión territorial</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f7f3;color:#1b2b22;font:16px/1.5 "Segoe UI",system-ui,sans-serif}
    main{width:min(620px,calc(100% - 32px));padding:42px;border:1px solid #e6ece6;border-radius:20px;background:#fff;box-shadow:0 18px 60px #203a2b12}
    .brand{display:flex;align-items:center;gap:12px;color:#194a38;font-size:13px;font-weight:800;letter-spacing:.16em}
    .mark{width:42px;height:42px;display:grid;place-items:center;border-radius:13px;color:#224c39;background:#cae6a0;font-size:25px}
    h1{margin:28px 0 8px;font-size:clamp(26px,5vw,38px);line-height:1.1;letter-spacing:-.045em}
    p{margin:0;color:#77867c;font-size:14px}
    a{display:inline-flex;margin-top:24px;padding:12px 16px;border-radius:9px;color:#fff;background:#194a38;text-decoration:none;font-size:13px;font-weight:700}
    a:hover{background:#123d2e}small{display:block;margin-top:14px;color:#9aa49d;font-size:11px}
  </style>
</head>
<body>
  <main>
    <div class="brand"><span class="mark">⌖</span><span>SIT-CAT</span></div>
    <h1>Sistema de Información Territorial Catastral</h1>
    <p>Abriendo el tablero municipal de Cuatro Cañadas…</p>
    <a href="http://localhost:8081/?origen=archivo-local">Abrir SIT-CAT</a>
    <small>El sistema requiere que Docker esté activo. Si no abre automáticamente, usa el botón.</small>
  </main>
  <script>window.location.replace("http://localhost:8081/?origen=archivo-local");</script>
</body>
</html>
